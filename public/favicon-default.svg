<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Colours are baked in, unlike every other mark in the app: a favicon is
    fetched by the browser outside the page, so it cannot read the theme's CSS
    variables. These are the Default theme's --primary and --background at the
    time of writing. Changing the palette means changing this file too.
  -->

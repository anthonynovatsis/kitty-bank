    <path d="M32 12 L54 24 L54 28 L10 28 L10 24 Z"/>
    <rect x="16" y="32" width="6" height="16" rx="1.5"/>
    <rect x="29" y="32" width="6" height="16" rx="1.5"/>
    <rect x="42" y="32" width="6" height="16" rx="1.5"/>
    <rect x="10" y="51" width="44" height="5" rx="2"/>
  </g>
</svg>
